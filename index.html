<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Three Kingdoms Cards · Legal</title>
<style>
  :root{--ink:#2a2318;--faint:#8b7f6a;--paper:#fbf7ec;--paper2:#f4ecdb;--line:#d9cdb4;--gold:#b8912f;--seal:#9c2b20}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper2);color:var(--ink);
    font:16px/1.7 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:14px;
    box-shadow:0 10px 30px rgba(60,48,28,.10);padding:36px 30px;max-width:460px;width:100%;text-align:center}
  .seal{width:56px;height:56px;margin:0 auto 16px;border:2px solid var(--gold);border-radius:10px;
    display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:28px;font-weight:700}
  h1{margin:0 0 6px;font-size:21px;letter-spacing:.02em}
  .sub{margin:0 0 26px;font-size:12.5px;color:var(--faint);letter-spacing:.16em;text-transform:uppercase}
  a.btn{display:block;text-decoration:none;color:var(--ink);background:#f7f0dd;border:1px solid #e2d4b4;
    border-radius:10px;padding:14px 16px;margin:10px 0;font-size:15px;font-weight:600;
    transition:transform .12s ease,box-shadow .12s ease}
  a.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(60,48,28,.12)}
  a.btn small{display:block;font-weight:400;font-size:12.5px;color:var(--faint);margin-top:2px}
  footer{margin-top:24px;font-size:12px;color:var(--faint)}
</style>
</head>
<body>
  <div class="card">
    <div class="seal">卡</div>
    <h1>Three Kingdoms Cards</h1>
    <p class="sub">Legal</p>
    <a class="btn" href="privacy.html">Privacy Policy <small>隐私政策 · English &amp; 中文</small></a>
    <a class="btn" href="probability.html">Draw Rates <small>卡包概率公示 · Drop rates &amp; card pool</small></a>
    <footer>© 2026 · Individual developer<br>Contact: ahshg686@163.com</footer>
  </div>
</body>
</html>
