name: Deploy legal site

# 纯静态页面，推到 main 自动发布到 GitHub Pages。
# 首次运行会自动为仓库开启 Pages（configure-pages 的 enablement），无需手工去 Settings 点开关。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 开启并配置 Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: 打包站点
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 发布
        id: deployment
        uses: actions/deploy-pages@v4
